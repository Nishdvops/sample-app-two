name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: Nishdvops/devops-reusable-workflows/.github/workflows/ci.yml@main
    with:
      image-name: sample-app-two
      dockerfile: docker/Dockerfile
      test-command: python3 -m pip install -r requirements/dev.txt && python3 -m pytest
